<!doctype html>
<!-- The Mac disk image's window background (600x440; rendered at 1x and 2x by scripts/dmg-background.ts into
     build/background.png and build/background@2x.png). Finder draws the two icons on top of it, centred at
     (170, 196) and (430, 196) at 120 px, as set in electron-builder.yml's dmg.contents; keep the arrow between them. -->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=block" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 600px; height: 440px; overflow: hidden; }
  body {
    position: relative;
    background: #f4f1ec;
    color: #1c1530;
    font-family: Inter, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* the board's dot grid, fading out towards the edges */
  .dots {
    position: absolute; inset: 0;
    background: radial-gradient(circle, rgba(28, 21, 48, 0.14) 1px, transparent 1.4px) 0 0 / 20px 20px;
    -webkit-mask-image: radial-gradient(closest-side at 50% 46%, #000 40%, transparent 100%);
  }
  .eyebrow {
    position: absolute; top: 34px; left: 0; right: 0; text-align: center;
    font-size: 12px; font-weight: 600; letter-spacing: 0.01em; color: #57506a;
  }
  .eyebrow::before {
    content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 0;
    background: #cdb8ff; box-shadow: 0 0 0 1.5px #2c1f57;
  }
  h1 {
    position: absolute; top: 56px; left: 0; right: 0; text-align: center;
    font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 29px; letter-spacing: -0.03em; line-height: 1.1;
  }
  .hl { position: relative; z-index: 0; }
  .hl::before {
    content: ''; position: absolute; z-index: -1; left: -0.05em; right: -0.04em; bottom: 0.08em; height: 0.34em;
    border-radius: 0.12em; background: #cdb8ff; transform: rotate(-1.4deg);
  }
  /* soft pads under where Finder puts the two icons */
  .pad { position: absolute; top: 196px; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 34px; background: radial-gradient(closest-side, rgba(205, 184, 255, 0.34), rgba(205, 184, 255, 0)); }
  .pad.a { left: 170px; }
  .pad.b { left: 430px; }
  svg.arrow { position: absolute; left: 248px; top: 178px; width: 104px; height: 36px; overflow: visible; }
  .note {
    position: absolute; left: 44px; right: 44px; top: 312px;
    padding: 13px 16px 13px 46px; border-radius: 14px;
    background: rgba(255, 253, 250, 0.82);
    box-shadow: 0 0 0 1px rgba(28, 21, 48, 0.1), 0 10px 22px -16px rgba(28, 21, 48, 0.45);
    font-size: 11.5px; line-height: 1.45; color: #57506a;
  }
  .note b { display: block; font-size: 12px; font-weight: 600; color: #1c1530; margin-bottom: 2px; }
  .note i { font-style: normal; font-weight: 600; color: #1c1530; white-space: nowrap; }
  .note .key {
    position: absolute; left: 14px; top: 14px; width: 22px; height: 22px; border-radius: 7px;
    background: #2c1f57; display: grid; place-items: center;
  }
  .note .key svg { width: 13px; height: 13px; fill: none; stroke: #cdb8ff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="dots"></div>
  <p class="eyebrow">Panes for Mac</p>
  <h1>Drag Panes into <span class="hl">Applications.</span></h1>
  <div class="pad a"></div>
  <div class="pad b"></div>
  <svg class="arrow" viewBox="0 0 104 36" aria-hidden="true">
    <path d="M4 22 C 30 4, 66 4, 90 18" fill="none" stroke="#2c1f57" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0 9.5" />
    <path d="M80 10.5 L92 19 L79 24" fill="none" stroke="#2c1f57" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
  <div class="note">
    <span class="key"><svg viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="2" /><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" /></svg></span>
    <b>The first time you open it</b>
    macOS checks with you once, as Panes isn't from the App Store. If it says Panes can't be opened, choose <i>Done</i>, then go to <i>System Settings › Privacy &amp; Security</i> and click <i>Open Anyway</i>.
  </div>
</body>
</html>
