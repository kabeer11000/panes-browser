appId: pk.procheck.panes
productName: Panes
copyright: Copyright (c) Kabeers Network
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/**'
  - '!tasks/**'
  - '!.debug-*'
  - '!{Logos.zip,No Background.png,Transparent.png,Light.png}'
  - '!.preview-profile/**'
  - '!.remember/**'
  - '!dithered.mp4'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # adblock-rs is built from source on install: only js/index.js, js/index.node and package.json are needed to run it,
  # not its Rust sources or the ~200 MB cargo target folder.
  - '!node_modules/adblock-rs/{target,src,benches,fuzz,data}/**'
  - '!node_modules/adblock-rs/js/{src,test}/**'
  - '!node_modules/adblock-rs/{Cargo.toml,Cargo.lock,rust-toolchain.toml,rustfmt.toml}'
  # koffi (touchpad raw input, Windows only): just the Windows x64/arm64 binaries, not the other 16 platforms or sources
  - '!node_modules/koffi/build/koffi/{darwin,freebsd,linux,musl,openbsd}_*/**'
  - '!node_modules/koffi/build/koffi/win32_ia32/**'
  - '!node_modules/koffi/{src,vendor,doc}/**'
# Nothing is unpacked from app.asar: an app layer update (src/shared/layers.ts) replaces app.asar alone, so a file kept
# beside it would stay the old one. Electron reads the window icon from inside the archive, and loads adblock-rs's
# native module from it too (copying it to a temporary file first), so electron-builder's automatic unpacking of
# native modules is off.
asar:
  smartUnpack: false
win:
  executableName: Panes
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
nsis:
  include: build/installer.nsh # registers Panes as a browser in Windows' default apps
  # the setup wizard wears Panes' colours instead of the stock blue-on-grey
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  # no version in the name, so releases/latest/download/Panes-setup.exe is a link that never changes
  artifactName: Panes-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - CFBundleURLTypes:
        - CFBundleURLName: Web link
          CFBundleURLSchemes: [http, https]
    - CFBundleDocumentTypes:
        - CFBundleTypeName: Web page
          CFBundleTypeRole: Viewer
          LSItemContentTypes: [public.html, public.xhtml, com.adobe.pdf]
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  mimeTypes: [x-scheme-handler/http, x-scheme-handler/https, text/html, application/xhtml+xml]
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  - provider: github
    owner: kabeer11000
    repo: panes-browser
    releaseType: release # a plain release, so /releases/latest finds it (prereleases are skipped)
